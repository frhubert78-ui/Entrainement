<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon entraînement</title>
<meta name="theme-color" content="#2447A8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entraînement">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F3;--card:#fff;--ink:#18212B;--soft:#5A6674;--rest:#6F7C89;--line:#D3D9E0;--on:#fff;--main:#2447A8;--work:var(--main);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12171D;--card:#1B222B;--ink:#E6EAEF;--soft:#98A3B0;--rest:#6C7885;--line:#27303A;--on:#0B1220;--main:#7FA3FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:18px 18px 48px}
h1,h2,h3,.time,.phase,.big{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:1.9rem;margin:0 0 10px;line-height:1.1}
h2{font-size:1.8rem;margin:4px 0 2px;line-height:1.1}
h3{font-size:1.4rem;margin:22px 0 8px}
.sub{color:var(--soft);margin:0 0 14px}
button{font:inherit;border-radius:12px;border:2px solid var(--work);padding:10px 14px;min-height:48px;cursor:pointer;background:transparent;color:var(--ink)}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.back{border:0;min-height:40px;padding:6px 0;color:var(--work);font-weight:700}
/* profils */
.users{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px}
.users button{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);font-weight:600}
.users button.on{background:var(--main);border-color:var(--main);color:var(--on)}
/* cartes */
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--main));border-radius:14px;padding:12px 14px;margin:0 0 10px;min-height:64px}
.card .em{font-size:1.7rem;line-height:1}
.card b{display:block;font-size:1.05rem}
.card span{color:var(--soft);font-size:.88rem}
.card .done{margin-left:auto;color:var(--c);font-weight:700;font-size:.85rem;white-space:nowrap}
.today{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c,var(--main));border-radius:16px;padding:14px 16px;margin:0 0 14px}
.today .lbl{color:var(--soft);font-size:.9rem;text-transform:capitalize}
.today .big{font-size:1.7rem;font-weight:700;line-height:1.15;margin:2px 0 4px}
.today button{width:100%;background:var(--c);border-color:var(--c);color:#fff;font-weight:700;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.row button{flex:1 1 0;min-width:120px;border-color:var(--line);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.lv{display:flex;gap:6px;margin:4px 0 14px}
.lv button{flex:1;min-height:52px;padding:4px 6px;border-color:var(--line);font-size:.95rem;line-height:1.2}
.lv button[aria-pressed="true"]{background:var(--work);border-color:var(--work);color:#fff;font-weight:700}
/* minuteur */
.now{--cur:var(--soft);border-top:6px solid var(--cur);padding-top:10px}
.now.work,.now.calm{--cur:var(--work)}.now.rest{--cur:var(--rest)}
.phase{color:var(--cur);font-size:1.25rem;font-weight:700}
.tline{display:flex;align-items:center;gap:12px}
.time{font-size:5.6rem;font-weight:700;line-height:1;margin:2px 0 8px;flex:1}
.pose{width:120px;height:120px;flex:none;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#1f2833,#0b0e12 75%);border:1px solid #262e38;overflow:hidden}
.pose svg{width:100%;height:100%}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cur)}
.br{display:flex;align-items:center;gap:14px;height:60px;margin-top:8px;color:var(--work);font-weight:700;font-size:1.15rem}
.br[hidden]{display:none}
.dot{width:42px;height:42px;border-radius:50%;background:var(--work);opacity:.3;transition:transform .15s linear}
.now h2{font-size:1.9rem;margin:10px 0 0}
.sl{color:var(--soft);font-weight:600}
.now p{margin:6px 0 0;font-size:1.05rem}
.mid{color:var(--work);font-weight:700}
.next{color:var(--soft);font-size:.95rem!important}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px}
#go{flex:1 1 100%;background:var(--work);color:#fff;font-weight:700;font-size:1.15rem}
.btns button:not(#go){flex:1}
.tot{color:var(--soft);margin:0 0 8px}
details{border-top:1px solid var(--line);padding:8px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font-weight:700;cursor:pointer;padding:6px 0}
details p{margin:6px 0}details ul,details ol{margin:4px 0 8px;padding-left:20px}
.plan li{margin:2px 0}.plan span{color:var(--soft)}
/* semaine, historique, profils */
.wk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px}
.wk b{width:84px;flex:none}
select,input[type=text]{font:inherit;flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;min-width:0}
.hday{color:var(--soft);font-weight:700;margin:14px 0 6px;text-transform:capitalize}
.hitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:8px 8px 8px 12px;margin:0 0 6px}
.hitem div{flex:1}.hitem span{color:var(--soft);font-size:.85rem}
.hitem button{border:0;min-height:40px;padding:4px 10px;color:var(--soft)}
.empty{color:var(--soft);text-align:center;padding:30px 10px}
.save{width:100%;background:var(--main);border-color:var(--main);color:var(--on);font-weight:700;margin-top:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
/* fond d'écran */
html{background:var(--bg)}body{background:transparent}
.bgimg{position:fixed;inset:0;z-index:-2;background:url(fond.jpg) center/cover no-repeat}
.bgveil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(238,240,243,.66),rgba(238,240,243,.45))}
@media (prefers-color-scheme:dark){.bgveil{background:linear-gradient(180deg,rgba(18,23,29,.72),rgba(18,23,29,.55))}}
.now{background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:0 0 16px 16px;padding:10px 14px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card,.today,.stat,.wk,.hitem,.row button,.lv button:not([aria-pressed="true"]),.users button:not(.on),.btns button:not(#go){background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
details{background:color-mix(in srgb,var(--card) 70%,transparent);padding:8px 12px;border-radius:10px;margin-bottom:6px;border:0!important}
</style>
</head>

  rules:'<details open><summary>Sécurité avant tout</summary><ul><li>On ne frappe que la patte d\'ours, jamais le partenaire.</li><li>Le porteur tient la patte ferme, bras légèrement plié, et ne va jamais au-devant du coup.</li><li>Le frappeur dose sa force : précision d\'abord, puissance ensuite.</li><li>Gants bien serrés. Une douleur au poignet ou à l\'épaule : on arrête.</li></ul></details><details><summary>Conseils pour celui qui tient</summary><p>Annonce la combinaison à voix haute avant de présenter la patte. Présente-la pile au moment du coup, à hauteur de visage. Pour le crochet, tourne-la sur le côté ; pour l\'uppercut, face au sol. Encourage ton partenaire !</p></details>',
  build:n=>{const A=(DB.users[0]||{}).name||"Profil 1",B=(DB.users[1]||{}).name||"Profil 2";
   const a=[st("bx_saut",60,{sl:"Échauffement à deux"}),st("bx_echauf",60,{sl:"Échauffement à deux"}),st("bx_jab",60,{n:"Shadow léger",sl:"Échauffement à deux",c:"Chacun de son côté, coups légers dans le vide pour se chauffer."})];
   const T=["dx_12","dx_123","dx_upp","dx_libre"];
   for(let i=1;i<=n;i++){const hit=i%2?A:B,hold=i%2?B:A,th=T[Math.min(Math.floor((i-1)/2),3)];
    a.push(st(th,120,{t:"work",sl:"Round "+i+" sur "+n+" · "+hit+" frappe, "+hold+" tient la patte",mid:60,mc:"Deuxième minute : un peu plus vite, garde toujours haute."}));
    if(i<n)a.push(st("dx_echange",45,{t:"rest",sl:"Au tour de "+hold+" de frapper"}))}
   a.push(st("bx_av",60,{sl:"Retour au calme"}),st("s_pec",60,{sl:"Retour au calme"}));return a}},
 {id:"sq",nom:"Squat et soulevé",em:"🏋️",c:"#2447A8",mat:["Gilet 10 kg","Gilet 4 kg","2 poids de 10 kg"],prep:10,
  sub:"Dos plat, ventre serré, mouvements lents.",levels:[["Court",3],["Normal",4],["Long",5]],def:1,
  rules:'<details><summary>Les règles d\'or</summary><ul><li>Le dos reste plat comme une table, jamais rond.</li><li>Ventre serré avant chaque répétition.</li><li>Regard droit devant, menton légèrement rentré.</li><li>Une douleur vive au dos ou au genou : tu t\'arrêtes. Un muscle qui brûle, c\'est normal.</li></ul></details>',
  build:n=>{const a=[st("sq_poids",90,{sl:"Échauffement"}),st("sq_charn",90,{sl:"Échauffement"})];
   for(let i=1;i<=n;i++){a.push(st("sq_gob",45,{t:"work",sl:"Série "+i+" sur "+n}));a.push(st("repos",60,{c:i<n?"Respire profondément et secoue les jambes.":"Pose le poids du squat. Prends les 2 poids de 10 kg et mets le gilet de 4 kg."}))}
   for(let i=1;i<=n;i++){a.push(st("sq_dl",45,{t:"work",sl:"Série "+i+" sur "+n}));a.push(st("repos",60,{c:i<n?"Respire profondément, secoue les bras et les jambes.":"Pose les poids et retire le gilet. Bois un peu d'eau."}))}
   a.push(st("st_ischio",90,{sl:"Retour au calme"}),st("st_quad",90,{sl:"Retour au calme"}));return a}},
 {id:"tc",nom:"Tai Chi",em:"🌿",c:"#2F7561",mat:["Aucun matériel"],prep:5,breath:true,calm:true,
  sub:"Lent comme dans du miel. Genoux souples, épaules lourdes.",levels:[["Court",1],["Normal",1.5],["Long",2.1]],def:0,
  rules:'<details><summary>Les 3 règles d\'or</summary><ul><li>Genoux souples, jamais tendus.</li><li>Épaules lourdes, comme un manteau mouillé.</li><li>Le poids passe d\'une jambe à l\'autre comme de l\'eau. Respire par le nez.</li></ul></details><details><summary>Conseils</summary><p>Semaine 1 : 2 mouvements par jour suffisent. Dès la semaine 2 : les 6 d\'affilée. Si tes genoux gênent, plie moins les jambes.</p></details>',
  build:f=>scale([["tc_arbre",45],["tc_ouv",60],["tc_nuages",90],["tc_pousser",90],["tc_ballon",60],["tc_ferm",75]].map(([id,d],k)=>{const s=st(id,d,{breath:true,sl:"Mouvement "+(k+1)+" sur 6"});if(id==="tc_pousser"){s.mc="Change de jambe : pied opposé devant, nouvelles poussées."}return s}),f)}
];
const SBY=Object.fromEntries(SESSIONS.map(s=>[s.id,s]));
const minutes=steps=>Math.round(steps.reduce((t,s)=>t+s.d,0)/60);
function levelSteps(s,li){return s.build(s.levels[li][1])}

/* ============ PROFILS & STOCKAGE ============ */
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const ORDRE=[1,2,3,4,5,6,0];
const WEEK_DEF={1:"reveil",2:"sq",3:"tapis",4:"ballon",5:"complete",6:"tc",0:"soir"};
let DB;
function blankUser(id,name){return {id,name,hist:[],week:{...WEEK_DEF},lvl:{}}}
function load(){try{DB=JSON.parse(localStorage.getItem("ent_v2")||"null")}catch(e){DB=null}
 if(!DB||!DB.users){DB={users:[blankUser("u1","Moi"),blankUser("u2","Utilisateur 2")],cur:"u1",sound:true,voice:true}}}
function save(){try{localStorage.setItem("ent_v2",JSON.stringify(DB))}catch(e){}}
load();
const U=()=>DB.users.find(u=>u.id===DB.cur)||DB.users[0];
const dkey=d=>{const z=new Date(d);return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0")};
function streak(u){const days=new Set(u.hist.map(h=>h.d));let n=0,d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
 while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekStats(u){const d=new Date();const off=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-off);
 const h=u.hist.filter(x=>x.t>=d.getTime());return {n:h.length,min:h.reduce((t,x)=>t+(x.min||0),0)}}

/* ============ NAVIGATION (bouton retour du téléphone) ============ */
let view={v:"home"};
function go(v,replace){stopTimer();view=v;try{history[replace?"replaceState":"pushState"](v,"")}catch(e){}draw();window.scrollTo(0,0)}
window.addEventListener("popstate",e=>{stopTimer();view=e.state||{v:"home"};draw();window.scrollTo(0,0)});
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function setColor(c){document.documentElement.style.setProperty("--work",c||"var(--main)");document.querySelector('meta[name="theme-color"]').setAttribute("content",c||"#2447A8")}

function draw(){
 const app=$("app");
 if(view.v==="sess"&&SBY[view.id]) return drawSession(app,SBY[view.id]);
 setColor(null);
 if(view.v==="week") return drawWeek(app);
 if(view.v==="hist") return drawHist(app);
 if(view.v==="users") return drawUsers(app);
 drawHome(app);
}
function userChips(){return `<div class="users">${DB.users.map(u=>`<button data-user="${u.id}" class="${u.id===DB.cur?"on":""}">👤 ${esc(u.name)}</button>`).join("")}<button data-nav="users" aria-label="Renommer les profils">✏️</button></div>`}
function doneToday(u,id){const k=dkey(Date.now());return u.hist.some(h=>h.d===k&&(!id||h.s===id))}
function drawHome(app){
 const u=U(),today=new Date().getDay(),sid=u.week[today],s=SBY[sid],ws=weekStats(u),sk=streak(u);
 let h=`<h1>Mon entraînement</h1>${userChips()}`;
 if(s){const li=u.lvl[s.id]??s.def,m=minutes(levelSteps(s,li));
  h+=`<div class="today" style="--c:${s.c}"><div class="lbl">Aujourd'hui · ${JOURS[today]}</div><div class="big">${s.em} ${esc(s.nom)}</div>
  <div class="sub" style="margin:0">${m} min · ${s.mat.join(", ")}</div>${doneToday(u,s.id)?`<p style="margin:8px 0 0;color:${s.c};font-weight:700">✓ Faite aujourd'hui, bravo !</p>`:`<button data-sess="${s.id}">Commencer</button>`}</div>`}
 else h+=`<div class="today"><div class="lbl">Aujourd'hui · ${JOURS[today]}</div><div class="big">😌 Jour de repos</div><div class="sub" style="margin:0">Envie de bouger quand même ? Choisis une séance ci-dessous.</div></div>`;
 h+=`<div class="stats"><div class="stat"><b>${sk?"🔥 "+sk:"0"}</b><span>jour${sk>1?"s":""} d'affilée</span></div><div class="stat"><b>${ws.n}</b><span>séance${ws.n>1?"s":""} cette semaine</span></div><div class="stat"><b>${ws.min}</b><span>minutes cette semaine</span></div></div>
 <div class="row"><button data-nav="week">📅 Ma semaine</button><button data-nav="hist">📈 Historique</button></div>
 <h3>Toutes les séances</h3>`;
 for(const s of SESSIONS){const ms=s.levels.map((l,i)=>minutes(levelSteps(s,i))),r=ms.length>1?ms[0]+"–"+ms[ms.length-1]:ms[0];
  h+=`<button class="card" data-sess="${s.id}" style="--c:${s.c}"><span class="em">${s.em}</span><div><b>${esc(s.nom)}</b><span>${r} min · ${s.mat.join(", ")}</span></div>${doneToday(u,s.id)?`<span class="done">✓ aujourd'hui</span>`:""}</button>`}
 h+=`<div class="row" style="margin-top:14px"><button id="snd">${DB.sound?"🔔 Bips : oui":"🔕 Bips : non"}</button><button id="vox">${DB.voice?"🗣️ Voix : oui":"🤐 Voix : non"}</button></div>`;
 app.innerHTML=h;
 $("snd").onclick=()=>{DB.sound=!DB.sound;save();draw()};
 $("vox").onclick=()=>{DB.voice=!DB.voice;save();draw();if(DB.voice)say("La voix est activée.")};
}
function drawWeek(app){
 const u=U();let h=`<button class="back" data-back>← Retour</button><h2>📅 Ma semaine</h2><p class="sub">Semaine type de <b>${esc(u.name)}</b>. La séance du jour s'affiche sur l'accueil.</p>`;
 for(const d of ORDRE){h+=`<label class="wk"><b style="text-transform:capitalize">${JOURS[d]}</b><select data-day="${d}"><option value="">😌 Repos</option>${SESSIONS.map(s=>`<option value="${s.id}" ${u.week[d]===s.id?"selected":""}>${s.em} ${esc(s.nom)}</option>`).join("")}</select></label>`}
 h+=`<p class="sub">Conseil : alterne les jours de renforcement (squat, séance complète) avec des jours plus doux (mobilité, marche, étirements).</p>`;
 app.innerHTML=h;
 app.querySelectorAll("select[data-day]").forEach(sel=>sel.onchange=()=>{u.week[sel.dataset.day]=sel.value;save();toast("Semaine enregistrée")});
}
function drawHist(app){
 const u=U(),list=[...u.hist].sort((a,b)=>b.t-a.t);
 const m=new Date();m.setDate(1);m.setHours(0,0,0,0);const mo=u.hist.filter(x=>x.t>=m.getTime());
 let h=`<button class="back" data-back>← Retour</button><h2>📈 Historique</h2><p class="sub">Séances de <b>${esc(u.name)}</b></p>
 <div class="stats"><div class="stat"><b>${streak(u)}</b><span>jours d'affilée</span></div><div class="stat"><b>${mo.length}</b><span>séances ce mois</span></div><div class="stat"><b>${mo.reduce((t,x)=>t+(x.min||0),0)}</b><span>minutes ce mois</span></div></div>`;
 if(!list.length)h+=`<div class="empty">Aucune séance pour l'instant.<br>Elles s'enregistrent toutes seules quand tu arrives au bout.</div>`;
 let last="";
 for(const x of list.slice(0,120)){const s=SBY[x.s]||{nom:x.s,em:"•",c:"var(--main)"};
  if(x.d!==last){last=x.d;const dt=new Date(x.t);h+=`<div class="hday">${JOURS[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</div>`}
  h+=`<div class="hitem" style="--c:${s.c}"><div>${s.em} <b>${esc(s.nom)}</b><br><span>${x.min} min · ${new Date(x.t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span></div><button data-delh="${x.t}" aria-label="Supprimer">✕</button></div>`}
 app.innerHTML=h;
}
function drawUsers(app){
 let h=`<button class="back" data-back>← Retour</button><h2>👤 Profils</h2><p class="sub">Chaque profil a son historique, sa semaine type et ses durées préférées.</p>`;
 DB.users.forEach((u,i)=>{h+=`<label class="wk"><b>Profil ${i+1}</b><input type="text" maxlength="20" data-uname="${u.id}" value="${esc(u.name)}"></label>`});
 h+=`<button class="save" id="svu">Enregistrer</button>`;
 app.innerHTML=h;
 $("svu").onclick=()=>{app.querySelectorAll("[data-uname]").forEach(i=>{const u=DB.users.find(x=>x.id===i.dataset.uname);if(u)u.name=i.value.trim()||u.name});save();toast("Profils enregistrés");history.back()};
}

/* ============ SÉANCE / MINUTEUR ============ */
let CUR=null,S=[],starts=[],TOTAL=0,PREP=0,el=0,run=false,last=0,idx=-2,sec=-1,midDone=-1,recorded=false,ctx=null,wl=null,poseKey="";
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function beep(f,d){if(!DB.sound||!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function say(t){if(!DB.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const v=new SpeechSynthesisUtterance(t);v.lang="fr-FR";v.rate=1;const fr=speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));if(fr)v.voice=fr;speechSynthesis.speak(v)}catch(e){}}
function lock(on){try{if(on&&navigator.wakeLock){navigator.wakeLock.request("screen").then(l=>{wl=l}).catch(()=>{})}else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&run)lock(true)});
function stepAt(t){let r=0;for(let k=0;k<S.length;k++){if(t>=starts[k])r=k}return r}
function stopTimer(){if(run){run=false;lock(false)}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function setup(s,li){CUR=s;S=levelSteps(s,li);PREP=s.prep;TOTAL=0;starts=[];S.forEach(x=>{starts.push(TOTAL);TOTAL+=x.d});el=-PREP;idx=-2;sec=-1;midDone=-1;recorded=false;run=false;poseKey=""}
function drawSession(app,s){
 const u=U(),li=Math.min(u.lvl[s.id]??s.def,s.levels.length-1);setColor(s.c);setup(s,li);
 const uniq=[...new Set(S.map(x=>x.ex))].filter(x=>x!=="repos");
 let h=`<button class="back" data-back>← Séances</button><h2>${s.em} ${esc(s.nom)}</h2><p class="sub">${esc(s.sub)}</p>
 <div class="chips">${s.mat.map(m=>`<span class="chip">${esc(m)}</span>`).join("")}<span class="chip">👤 ${esc(u.name)}</span></div>`;
 if(s.levels.length>1)h+=`<div class="lv">${s.levels.map((l,i)=>`<button data-lvl="${i}" aria-pressed="${i===li}">${l[0]}<br><small>${minutes(levelSteps(s,i))} min</small></button>`).join("")}</div>`;
 h+=`<section class="now" id="now" aria-live="polite"><div class="phase" id="phase"></div><div class="tline"><div class="time" id="time"></div><div class="pose" id="pose" style="color:var(--work)"></div></div>
 <div class="bar"><i id="fill"></i></div><div class="br" id="br" hidden><span class="dot" id="dot"></span><span id="bt"></span></div>
 <h2 id="name"></h2><div class="sl" id="sl"></div><p id="cue"></p><p class="mid" id="midc"></p><p class="next" id="next"></p></section>
 <div class="btns"><button id="go">Démarrer</button><button id="skip">Passer</button><button id="reset">Recommencer</button></div>
 <p class="tot" id="tot"></p>
 <details><summary>Au programme (${S.length} étapes)</summary><ol class="plan">${S.map(x=>`<li>${esc(x.n)} <span>· ${fmt(x.d)}${x.sl?" · "+esc(x.sl):""}</span></li>`).join("")}</ol></details>
 <h3>Comment faire</h3>${s.rules||""}${uniq.map(id=>`<details><summary>${esc(EX[id][0])}</summary><div style="display:flex;gap:10px;align-items:flex-start"><div class="pose" data-ex="${id}" style="width:84px;height:84px"></div><p>${esc(EX[id][3]||EX[id][2])}</p></div></details>`).join("")}`;
 app.innerHTML=h;
 $("go").onclick=toggle;
 $("skip").onclick=()=>{if(el<0)el=0;else if(el<TOTAL){const k=stepAt(el);el=S[k+1]?starts[k+1]:TOTAL}last=performance.now();if(el>=TOTAL)finish();render()};
 $("reset").onclick=()=>{stopTimer();setup(s,li);render()};
 app.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{u.lvl[s.id]=+b.dataset.lvl;save();stopTimer();drawSession(app,s)});
 render();
}
function toggle(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume()}catch(e){}
 if(el>=TOTAL){el=-PREP;idx=-2;midDone=-1;recorded=false}
 run=!run;last=performance.now();lock(run);
 if(run&&el<=-PREP+0.2)say("Prépare-toi. On commence par : "+S[0].n);
 render()}
function finish(){el=TOTAL;run=false;lock(false);beep(523,1.4);say("Séance terminée. Bravo !");
 if(!recorded){recorded=true;const done=Math.max(1,minutes(S)),who=CUR.duo?DB.users:[U()];
  who.forEach(u=>u.hist.push({t:Date.now(),d:dkey(Date.now()),s:CUR.id,min:done}));save();toast("✓ Séance enregistrée pour "+who.map(u=>u.name).join(" et "))}}
function render(){
 if(view.v!=="sess"||!$("now"))return;
 let cls="",rem,dur,k,s,pk;
 if(el<0){rem=-el;dur=PREP;$("phase").textContent="Prépare-toi";$("name").textContent="Place-toi";$("sl").textContent="";$("cue").textContent="Ensuite : "+S[0].n+". "+S[0].c;$("midc").textContent="";$("next").textContent="";pk=S[0].ex}
 else if(el>=TOTAL){cls="calm";rem=0;dur=1;$("phase").textContent="Terminé";$("name").textContent="Bravo 🎉";$("sl").textContent="";$("cue").textContent="Bois un peu d'eau. C'est la régularité qui compte.";$("midc").textContent="";$("next").textContent="";pk="m_resp"}
 else{k=stepAt(el);s=S[k];cls=s.t;rem=starts[k]+s.d-el;dur=s.d;pk=s.ex;
  $("phase").textContent=s.t==="work"?"Effort":(s.t==="rest"?"Repos":(s.sl||"En douceur"));
  $("name").textContent=s.n;$("sl").textContent=(s.t==="work"||s.ex==="dx_echange")?s.sl:"";$("cue").textContent=s.c;
  $("midc").textContent=(s.mid&&el-starts[k]>=s.mid)?s.mc:"";
  $("next").textContent=S[k+1]?"Ensuite : "+S[k+1].n+(S[k+1].t==="work"&&S[k+1].sl?", "+S[k+1].sl.toLowerCase():""):""}
 if(pk!==poseKey){poseKey=pk;$("pose").dataset.ex=pk;animEx($("pose"),performance.now())}
 const br=$("br");
 if(s&&s.breath&&el>=0&&el<TOTAL){const p=((el%8)+8)%8;br.hidden=false;$("bt").textContent=p<4?"Inspire":"Expire";$("dot").style.transform=reduce?"none":"scale("+(.65+.65*(1-Math.cos(2*Math.PI*p/8))/2)+")"}else br.hidden=true;
 $("now").className="now "+cls;$("time").textContent=fmt(rem);$("fill").style.width=(100*(1-rem/dur))+"%";
 $("tot").textContent=el<0?"Séance de "+Math.round(TOTAL/60)+" minutes":(el>=TOTAL?"Séance terminée":"Reste "+fmt(TOTAL-Math.max(0,el))+" sur la séance");
 $("go").textContent=el>=TOTAL?"Refaire":(run?"Pause":(el>-PREP?"Reprendre":"Démarrer"));
}
function tick(){
 if(!run||view.v!=="sess")return;
 const n=performance.now();el+=(n-last)/1000;last=n;
 if(el>=TOTAL){finish()}
 else{
  if(el>=0){const k=stepAt(el),s=S[k];
   if(k!==idx){idx=k;beep(s.t==="work"?700:(s.t==="rest"?440:560),.6);midDone=-1;say(s.n+(s.t==="work"&&s.sl?", "+s.sl:""))}
   if(s.mid&&midDone!==k&&el-starts[k]>=s.mid){midDone=k;beep(660,.3);say(s.mc)}}
  if(!CUR.calm){const k=stepAt(el),r=Math.ceil(el<0?-el:starts[k]+S[k].d-el);if(r!==sec){sec=r;if(r>=1&&r<=3)beep(880,.12)}}
 }
 render();
}
setInterval(tick,100);

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-sess],[data-nav],[data-user],[data-back],[data-delh]");if(!t)return;
 if(t.dataset.sess)go({v:"sess",id:t.dataset.sess});
 else if(t.dataset.nav)go({v:t.dataset.nav});
 else if(t.dataset.user){DB.cur=t.dataset.user;save();draw();toast("Profil : "+U().name)}
 else if(t.hasAttribute("data-back")){if(history.state&&history.state.v!=="home"&&history.length>1)history.back();else go({v:"home"},true)}
 else if(t.dataset.delh){const u=U();u.hist=u.hist.filter(h=>String(h.t)!==t.dataset.delh);save();draw();toast("Séance supprimée")}
});
try{history.replaceState({v:"home"},"")}catch(e){}
draw();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
